# Bac à sable NextStep (AG-033 d'ATELIERS_NEWGEN, option A choisie par
# l'utilisateur le 27/10/2026) : chaque push sur la branche `sandbox` publie
# les pages dans ~/www/sandbox/nextstep/ chez Alwaysdata
# → https://<compte>.alwaysdata.net/sandbox/nextstep/
# Elles parlent à l'API du bac à sable de NEWGEN (fausses données) parce que
# leur chemin commence par /sandbox/ (urlApiPour, utils.js) : JAMAIS un autre
# dossier, sinon elles parleraient à l'API de production.
# Ni API, ni base, ni données ici : tout ça est publié par deploy-sandbox.yml
# d'ATELIERS_NEWGEN, qui exclut ce sous-dossier de son nettoyage.
#
# Secrets de ce dépôt, saisis par l'utilisateur, jamais vus par Claude :
#   ALWAYSDATA_COMPTE, ALWAYSDATA_SSH_KEY (les mêmes que dans ATELIERS_NEWGEN).
name: Déploiement du bac à sable

permissions:
  contents: read

on:
  push:
    branches: [sandbox]
  workflow_dispatch:

concurrency:
  group: deploy-sandbox
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/sandbox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la syntaxe
        run: for f in utils.js logic.js shared.js app.js admin_app.js admin_config.js; do node --check "$f"; done

      - name: Tests Node
        run: node --test utils.test.js logic.test.js contract.test.js reseau.test.js

      # Le garde-fou qui compte : ces pages, à cette adresse, appellent l'API du
      # bac à sable. Vérifié sur le utils.js publié, pas seulement sur les tests.
      - name: Contrôler l'aiguillage vers l'API du bac à sable
        run: |
          node -e "
            const {urlApiPour}=require('./utils.js');
            const u=urlApiPour('ateliers-numeriques.alwaysdata.net','/sandbox/nextstep/index.html');
            if(!u.includes('/api-sandbox/')){console.error('::error::les pages parleraient à '+u);process.exit(1);}
            console.log('API appelée : '+u);"

      - name: Préparer l'accès SSH
        env:
          CLE: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          COMPTE: ${{ secrets.ALWAYSDATA_COMPTE }}
        run: |
          if [ -z "$CLE" ] || [ -z "$COMPTE" ]; then echo "::error::Secret ALWAYSDATA_COMPTE ou ALWAYSDATA_SSH_KEY absent de ce dépôt"; exit 1; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CLE" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Copier les pages
        env:
          COMPTE: ${{ secrets.ALWAYSDATA_COMPTE }}
        run: |
          SSH="ssh -o StrictHostKeyChecking=accept-new"
          # Le bac à sable de NEWGEN (API et pages) doit exister avant.
          $SSH "$COMPTE@ssh-$COMPTE.alwaysdata.net" 'test -f www/sandbox/index.html && test -d www/api-sandbox' \
            || { echo "::error::Bac à sable de NEWGEN absent : lancer d'abord son deploy-sandbox.yml"; exit 1; }
          # Coupure d'urgence en cours (coupure-urgence.yml de NEWGEN) : on publie
          # quand même dans le sous-dossier, sans toucher à sandbox/.htaccess,
          # mais le run finit rouge pour qu'elle ne passe pas pour un service ouvert.
          if $SSH "$COMPTE@ssh-$COMPTE.alwaysdata.net" 'grep -qs "Require all denied" www/sandbox/.htaccess www/api-sandbox/.htaccess'; then
            echo "COUPE=1" >> "$GITHUB_ENV"
          fi
          mkdir -p pages && cp -r index.html admin.html *.css utils.js logic.js shared.js app.js admin_app.js admin_config.js xlsxstyle.js icons vendor pages/
          rsync -az --delete -e "$SSH" pages/ "$COMPTE@ssh-$COMPTE.alwaysdata.net:www/sandbox/nextstep/"

      - name: Vérifier en ligne
        env:
          COMPTE: ${{ secrets.ALWAYSDATA_COMPTE }}
        run: |
          if [ "$COUPE" = "1" ]; then echo "::error::Pages publiées, mais le bac à sable est COUPÉ (coupure d'urgence) : rouvrir depuis coupure-urgence.yml de NEWGEN"; exit 1; fi
          B="https://$COMPTE.alwaysdata.net/sandbox/nextstep"
          for page in index.html admin.html; do curl -fsS "$B/$page" | grep -q 'shared.js' || { echo "::error::$page absente ou incomplète"; exit 1; }; done
          curl -fsSL "$B" | grep -q 'shared.js' || { echo "::error::$B (sans / final) ne mène pas à la page"; exit 1; }
          curl -fsS "$B/utils.js" | grep -q 'api-sandbox'
          curl -fsS -d action=getComptes "https://$COMPTE.alwaysdata.net/api-sandbox/index.php" | grep -q '"ok":true'
          echo "::notice::Bac à sable NextStep : https://$COMPTE.alwaysdata.net/sandbox/nextstep/"
